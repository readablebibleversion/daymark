<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daymark</title>
    <meta name="description" content="A simple weekly goal and habit tracker." />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daymark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background-color: #F6F4EF; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      @media (prefers-color-scheme: dark) { body { background-color: #111315; } }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Daymark.</noscript>
    <div id="root"></div>
    <script>
      // Offline support. sw.js is generated by `npm run build`; it does not exist on the dev server.
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1):8081$/.test(location.host)) {
        window.addEventListener('load', function () {
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
          navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
        });
      }
    </script>
  </body>
</html>
